[project]
name = "renpho-mcp-server"
version = "0.1.0"
description = "Read-only, token-frugal MCP server for Renpho body-composition data"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "renpho-api>=0.2,<0.3"]

[project.scripts]
renpho-mcp = "renpho_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renpho_mcp"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
