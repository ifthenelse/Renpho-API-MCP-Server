# CI is the authoritative gate. Pin actions to commit SHAs if your policy requires it.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: bash scripts/verify # ruff lint + format check + pytest
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t renpho-mcp .
      - name: Smoke test (tool listing, no credentials needed)
        run: |
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 4; } \
            | docker run -i --rm renpho-mcp | tee out.txt
          grep -q '"name":"measurements"' out.txt
